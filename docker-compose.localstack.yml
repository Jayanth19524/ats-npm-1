# LocalStack + MailHog for local dev testing
# Usage:
#   docker compose -f docker-compose.localstack.yml up
#
# Services:
#   LocalStack  → S3 at http://localhost:4566
#   MailHog     → SMTP at localhost:1025  |  web UI at http://localhost:8025

services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ""   # community edition needs no token
    volumes:
      - localstack_data:/var/lib/localstack
      # Auto-create the bucket on startup:
      - ./scripts/localstack-init:/etc/localstack/init/ready.d

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI  →  http://localhost:8025

volumes:
  localstack_data:
